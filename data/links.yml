# Партнёрские ссылки. Сюда Ник вставляет реальные ссылки из кабинетов.
# В статьях: [текст]({{aff:ключ}}). Пока url пустой, в статье выводится обычный текст без ссылки.
#
# name       - название магазина (для людей)
# url        - партнёрская ссылка из кабинета (ставит только Ник)
# advertiser - юрлицо/ИП рекламодателя для маркировки (если требует программа)
# inn        - ИНН рекламодателя
# erid       - токен маркировки (если требует программа; выдаёт программа или ОРД)
#
# Что именно нужно для маркировки, проверь в правилах конкретной программы и у бухгалтера/юриста.

