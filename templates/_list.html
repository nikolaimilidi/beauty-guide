{% if posts %}
<ul class="post-list">
  {% for p in posts %}
  <li>
    <span class="tag tag-{{ p.category }}">{{ cats[p.category].title }}</span>
    <a href="{{ u('/' + p.slug + '/') }}">{{ p.title }}</a>
    <p>{{ p.description }}</p>
    <time datetime="{{ p.date.isoformat() }}">{{ ru_date(p.date) }}</time>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">Первые статьи скоро появятся.</p>
{% endif %}
